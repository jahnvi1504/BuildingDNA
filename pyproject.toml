[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-loop-building-agents"
version = "0.1.0"
description = "Live Reflex + Reason control for EnergyPlus"
requires-python = ">=3.11,<3.13"
dependencies = [
  "eppy==0.5.63",
  "groq==0.31.1",
  "mcp==1.13.1",
  "pandas==2.3.1",
  "plotly==6.2.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "streamlit==1.47.0",
]

[project.scripts]
ecoloop = "ecoloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

